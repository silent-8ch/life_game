<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>v4 sprite checker — grid cut</title>
        <style>
            :root {
                color-scheme: dark;
                --ink: #e2e8f0;
                --dim: #94a3b8;
                --line: #1e293b;
                --panel: #0f172a;
                --bg: #05070a;
                --pick: #fbbf24;
                --ok: #34d399;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0; background: var(--bg); color: var(--ink);
                font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
                display: grid; grid-template-columns: 260px 1fr; min-height: 100vh;
            }
            h1 { font-size: 16px; margin: 0 0 4px; }
            h2 { font-size: 14px; margin: 0 0 10px; color: var(--dim); font-weight: 500; }
            code { font-family: ui-monospace, monospace; color: var(--pick); }
            button {
                font: inherit; padding: 6px 12px; margin: 0 6px 0 0;
                border: 1px solid #334155; border-radius: 5px;
                background: #1b2432; color: var(--ink); cursor: pointer;
            }
            button:hover { border-color: #475569; }
            button.primary { background: #1d4ed8; border-color: #1d4ed8; }
            label.opt { color: var(--dim); font-size: 12px; margin-left: 8px; }
            input[type="number"] {
                font: inherit; width: 56px; padding: 4px 6px;
                background: #0b1220; border: 1px solid #334155; border-radius: 5px; color: var(--ink);
            }
            input[type="text"] {
                font: inherit; padding: 6px 10px; width: 240px;
                background: #0b1220; border: 1px solid #334155; border-radius: 5px; color: var(--ink);
            }

            aside {
                border-right: 1px solid var(--line); background: var(--panel);
                overflow-y: auto; max-height: 100vh;
            }
            aside .head { padding: 14px 14px 8px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
            aside .count { color: var(--dim); font-size: 12px; }
            .file {
                display: flex; align-items: center; gap: 8px;
                padding: 6px 14px; cursor: pointer; border-left: 3px solid transparent;
                font: 12px/1.3 ui-monospace, monospace; color: var(--dim); word-break: break-all;
            }
            .file:hover { background: #131c2b; }
            .file.active { border-left-color: var(--pick); color: var(--ink); }
            .file.done { color: var(--ok); }
            .file .tick { width: 12px; flex: none; }
            .file .dims { color: #475569; font-size: 10px; margin-left: auto; }

            main { padding: 18px 22px; overflow: auto; }
            .controls { margin: 4px 0 14px; }

            /* Alpha has to be visible or a keyed sprite cannot be judged, so the
               sheet sits on a checkerboard. */
            .wrap { position: relative; display: inline-block; border: 1px solid var(--line); touch-action: none; }
            .wrap.checker {
                background-color: #0b1220;
                background-image:
                    linear-gradient(45deg, #131c2b 25%, transparent 25%),
                    linear-gradient(-45deg, #131c2b 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, #131c2b 75%),
                    linear-gradient(-45deg, transparent 75%, #131c2b 75%);
                background-size: 20px 20px;
                background-position: 0 0, 0 10px, 10px -10px, -10px 0;
            }
            .wrap img { display: block; max-width: min(100%, 1000px); max-height: 78vh; height: auto; user-select: none; -webkit-user-drag: none; }

            /* Every cut line is a wide invisible grabber with a thin bright
               core, so a 2px line is still easy to grab. */
            .vline { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px; cursor: col-resize; z-index: 3; }
            .vline::after { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--pick); box-shadow: 0 0 0 1px rgba(2,6,12,0.6); }
            .hline { position: absolute; left: 0; right: 0; height: 14px; margin-top: -7px; cursor: row-resize; z-index: 3; }
            .hline::after { content: ''; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--pick); box-shadow: 0 0 0 1px rgba(2,6,12,0.6); }
            .vline.edge::after, .hline.edge::after { background: #38bdf8; }

            .readout { color: var(--dim); font-size: 12px; margin: 10px 0; }
            textarea {
                width: 100%; height: 200px; margin-top: 12px;
                background: #0b1220; color: var(--dim); border: 1px solid var(--line);
                border-radius: 6px; font: 12px/1.5 ui-monospace, monospace; padding: 10px;
            }
            .hint { color: var(--dim); font-size: 12px; margin: 4px 0 12px; }
            .empty { color: var(--dim); padding: 40px 0; }
        </style>
    </head>
    <body>
        <aside>
            <div class="head">
                <h1>v4 grid cut</h1>
                <div class="count" id="count">loading…</div>
                <label class="opt"><input type="checkbox" id="onlyOptions" checked /> only option sheets</label>
            </div>
            <div id="files"></div>
        </aside>

        <main>
            <div id="work"><p class="empty">Pick a sheet on the left.</p></div>

            <h2 style="margin-top:28px">Result</h2>
            <p class="hint">
                Per sheet: <code>{ sheet, cols, rows, xs:[…], ys:[…], cells:[{row,col,box:[x,y,w,h]}] }</code>
                — <code>xs</code>/<code>ys</code> are the cut lines in image pixels, sorted; <code>cells</code>
                is every candidate the grid carves out. Copy this and hand it back.
            </p>
            <button id="copy">Copy JSON</button>
            <button id="download">Download v4-grid.json</button>
            <textarea id="json" readonly></textarea>
        </main>

        <script>
            const VERSION = 'v4';

            const filesEl = document.getElementById('files');
            const countEl = document.getElementById('count');
            const workEl = document.getElementById('work');
            const jsonEl = document.getElementById('json');
            const onlyOptionsEl = document.getElementById('onlyOptions');

            /** file -> saved grid, so re-opening a sheet shows its lines back. */
            const saved = {};
            let all = [];
            let sprites = [];
            let active = null;

            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const evenly = (n, span) =>
                Array.from({ length: n + 1 }, (_, i) => Math.round((i / n) * span));

            // xs/ys carry the boundaries in the order they were dragged; sort
            // only when deriving cells, so a line's identity is stable mid-drag.
            const cellsOf = (grid) => {
                const xs = [...grid.xs].sort((a, b) => a - b);
                const ys = [...grid.ys].sort((a, b) => a - b);
                const cells = [];
                for (let r = 0; r < ys.length - 1; r++) {
                    for (let c = 0; c < xs.length - 1; c++) {
                        cells.push({
                            row: r, col: c,
                            box: [xs[c], ys[r], xs[c + 1] - xs[c], ys[r + 1] - ys[r]],
                        });
                    }
                }
                return { xs, ys, cells };
            };

            const emit = () => {
                const items = sprites.map((s) => saved[s.file]).filter(Boolean)
                    .concat(all.filter((s) => saved[s.file] && !sprites.includes(s)).map((s) => saved[s.file]));
                // de-dup by sheet, keep insertion order of `all`
                const seen = new Set();
                const out = [];
                for (const s of all) {
                    if (saved[s.file] && !seen.has(s.file)) { seen.add(s.file); out.push(saved[s.file]); }
                }
                jsonEl.value = JSON.stringify(out, null, 1);
            };

            const renderList = () => {
                const done = all.filter((s) => saved[s.file]).length;
                countEl.textContent = `${sprites.length} shown · ${done} done`;
                filesEl.replaceChildren();
                for (const s of sprites) {
                    const row = document.createElement('div');
                    row.className = 'file';
                    if (active && active.file === s.file) row.classList.add('active');
                    if (saved[s.file]) row.classList.add('done');
                    row.innerHTML =
                        `<span class="tick">${saved[s.file] ? '✓' : ''}</span>` +
                        `<span>${s.name}</span>` +
                        `<span class="dims">${s.w}×${s.h}</span>`;
                    row.addEventListener('click', () => open(s));
                    filesEl.append(row);
                }
            };

            const open = (sprite) => {
                active = sprite;
                renderList();
                const img = new Image();
                img.onload = () => editor(sprite, img);
                img.src = sprite.url;
            };

            function editor(sprite, img) {
                const natW = img.naturalWidth, natH = img.naturalHeight;

                // Start from a saved grid, or a default guess: a square-ish grid
                // fit to the sheet's aspect, which for a 16-candidate sheet is 4×4.
                const prior = saved[sprite.file];
                const guessCols = prior ? prior.cols : 4;
                const guessRows = prior ? prior.rows : 4;
                const grid = prior
                    ? { cols: prior.cols, rows: prior.rows, xs: [...prior.xs], ys: [...prior.ys] }
                    : { cols: guessCols, rows: guessRows, xs: evenly(guessCols, natW), ys: evenly(guessRows, natH) };

                workEl.innerHTML = `<h2>${sprite.file} — drag the lines onto the cell edges</h2>`;

                const controls = document.createElement('div');
                controls.className = 'controls';
                controls.innerHTML =
                    `cols <input type="number" id="cols" min="1" max="12" value="${grid.cols}">` +
                    `<label class="opt"></label>` +
                    `rows <input type="number" id="rows" min="1" max="12" value="${grid.rows}">` +
                    `<button id="reset" style="margin-left:12px">Reset to even</button>` +
                    `<button id="save" class="primary" style="margin-left:12px">Save sheet</button>`;
                workEl.append(controls);

                const wrap = document.createElement('div');
                wrap.className = 'wrap checker';
                const shown = img.cloneNode();
                wrap.append(shown);
                workEl.append(wrap);

                const readout = document.createElement('div');
                readout.className = 'readout';
                workEl.append(readout);

                const describe = () => {
                    const { cells } = cellsOf(grid);
                    readout.textContent =
                        `${grid.cols}×${grid.rows} = ${cells.length} cells · ` +
                        `xs [${[...grid.xs].sort((a,b)=>a-b).join(', ')}] · ` +
                        `ys [${[...grid.ys].sort((a,b)=>a-b).join(', ')}]`;
                };

                // Re-lay the lines. Rebuilt on cols/rows/reset; individual drags
                // just move one element and its stored value.
                const layout = () => {
                    for (const el of wrap.querySelectorAll('.vline, .hline')) el.remove();

                    grid.xs.forEach((x, i) => {
                        const el = document.createElement('div');
                        el.className = 'vline' + (i === 0 || i === grid.xs.length - 1 ? ' edge' : '');
                        el.style.left = `${(x / natW) * 100}%`;
                        el.addEventListener('pointerdown', (event) => {
                            event.preventDefault();
                            el.setPointerCapture(event.pointerId);
                            const move = (e) => {
                                const rect = shown.getBoundingClientRect();
                                const nx = clamp(Math.round(((e.clientX - rect.left) / rect.width) * natW), 0, natW);
                                grid.xs[i] = nx;
                                el.style.left = `${(nx / natW) * 100}%`;
                                describe();
                            };
                            const up = () => {
                                el.releasePointerCapture(event.pointerId);
                                el.removeEventListener('pointermove', move);
                                el.removeEventListener('pointerup', up);
                            };
                            el.addEventListener('pointermove', move);
                            el.addEventListener('pointerup', up);
                        });
                        wrap.append(el);
                    });

                    grid.ys.forEach((y, i) => {
                        const el = document.createElement('div');
                        el.className = 'hline' + (i === 0 || i === grid.ys.length - 1 ? ' edge' : '');
                        el.style.top = `${(y / natH) * 100}%`;
                        el.addEventListener('pointerdown', (event) => {
                            event.preventDefault();
                            el.setPointerCapture(event.pointerId);
                            const move = (e) => {
                                const rect = shown.getBoundingClientRect();
                                const ny = clamp(Math.round(((e.clientY - rect.top) / rect.height) * natH), 0, natH);
                                grid.ys[i] = ny;
                                el.style.top = `${(ny / natH) * 100}%`;
                                describe();
                            };
                            const up = () => {
                                el.releasePointerCapture(event.pointerId);
                                el.removeEventListener('pointermove', move);
                                el.removeEventListener('pointerup', up);
                            };
                            el.addEventListener('pointermove', move);
                            el.addEventListener('pointerup', up);
                        });
                        wrap.append(el);
                    });

                    describe();
                };

                const rebuild = () => {
                    grid.cols = clamp(parseInt(document.getElementById('cols').value, 10) || 1, 1, 12);
                    grid.rows = clamp(parseInt(document.getElementById('rows').value, 10) || 1, 1, 12);
                    grid.xs = evenly(grid.cols, natW);
                    grid.ys = evenly(grid.rows, natH);
                    layout();
                };

                document.getElementById('cols').addEventListener('change', rebuild);
                document.getElementById('rows').addEventListener('change', rebuild);
                document.getElementById('reset').addEventListener('click', rebuild);
                document.getElementById('save').addEventListener('click', () => {
                    const { xs, ys, cells } = cellsOf(grid);
                    saved[sprite.file] = { sheet: sprite.file, cols: grid.cols, rows: grid.rows, xs, ys, cells };
                    emit();
                    const next = sprites.find((s) => !saved[s.file]);
                    if (next) open(next);
                    else { renderList(); workEl.innerHTML = '<p class="empty">All shown sheets done. Copy the JSON.</p>'; }
                });

                layout();
            }

            const applyFilter = () => {
                sprites = all.filter((s) => !onlyOptionsEl.checked || s.name.endsWith('-options'));
                renderList();
            };

            document.getElementById('copy').addEventListener('click', () => { jsonEl.select(); document.execCommand('copy'); });
            document.getElementById('download').addEventListener('click', () => {
                const blob = new Blob([jsonEl.value || '[]'], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'v4-grid.json';
                a.click();
                URL.revokeObjectURL(a.href);
            });
            onlyOptionsEl.addEventListener('change', applyFilter);

            Promise.all([
                fetch('/sprites/manifest.json').then((r) => r.json()),
                fetch('/sprites/people/v4/v4-grid.json').then((r) => (r.ok ? r.json() : [])).catch(() => []),
            ])
                .then(([manifest, grids]) => {
                    all = manifest.sprites
                        .filter((s) => s.folder === 'people' && s.sub === VERSION)
                        .sort((a, b) => a.name.localeCompare(b.name));
                    if (!all.length) { countEl.textContent = 'no v4 files in the manifest'; return; }
                    // Seed saved grids from the recorded JSON, so opening a sheet
                    // shows the lines exactly where they are stored — the check
                    // for whether a drag lands where it was recorded.
                    for (const g of grids || []) {
                        saved[g.sheet] = { sheet: g.sheet, cols: g.cols, rows: g.rows, xs: g.xs, ys: g.ys, cells: g.cells };
                    }
                    applyFilter();
                    emit();
                })
                .catch(() => { countEl.textContent = 'could not read /sprites/manifest.json'; });
        </script>
    </body>
</html>
